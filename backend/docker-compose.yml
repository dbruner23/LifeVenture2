services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lifeventure-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeventure
    ports:
      - "5433:5432"
    volumes:
      - lifeventure-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifeventure"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lifeventure-pgdata:
